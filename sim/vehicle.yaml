# 1:10 RoboRacer car: the one set of plant parameters for the simulator and trackgen.

# Chassis
mass_kg: 3.74
inertia_kgm2: 0.04712          # yaw inertia
length_front_m: 0.15875        # CoG to front axle
length_rear_m: 0.17145         # CoG to rear axle
cog_height_m: 0.074
ego_length_m: 0.5              # collision box
ego_width_m: 0.29
gravity_mps2: 9.81

# Tyres (Pacejka)
tyre_mu: 0.42
tyre_s: 1.2                    # peak lateral force scale
alpha_peak_rad: 0.16           # slip angle at peak force
cornering_stiffness_front: 4.718
cornering_stiffness_rear: 5.4562
sigma_fy_m: 0.03               # relaxation length of the lateral-force lag
kinematic_floor_mps: 0.5       # below this speed the kinematic model is used
tau_beta_kin_s: 0.15           # sideslip decay in the kinematic model

# Steering actuator
steer_lock_cmd_rad: 0.4189     # command at full policy steer, also the angle limit
steer_rate_max_radps: 3.2
steer_transport_s: 0.06        # command transport delay
tau_delta_s: 0.075
tau_delta_dot_s: 0.027
steer_delta_th_rad: 0.033      # deadband-like threshold of the command-to-angle map
steer_gamma: 0.622             # high-angle compression of the command-to-angle map

# Drive actuator
max_speed_mps: 4.0             # speed at full policy throttle
max_accel_mps2: 3.48
v_switch_mps: 7.319            # above this acceleration is power limited
tau_speed_plant_s: 0.118
tau_accel_s: 0.061
speed_transport_s: 0.02        # command transport delay

# Timing
control_period_s: 0.067        # one policy step
compute_latency_s: 0.02        # previous command held this long into each step
compute_latency_sd_s: 0.0      # latency spread drawn under sim2real (0 = fixed)

# LiDAR
lidar_num_beams: 811
lidar_fov_rad: 4.711932
lidar_max_range_m: 10.0
lidar_dist_m: 0.10355          # mount ahead of the CoG

# Sensor noise under sim2real: odometry std in normalised observation units, LiDAR in metres
obs_noise_s_norm: 0.0006
obs_noise_yaw_rate: 0.015
obs_noise_vel: 0.0052
obs_noise_yaw: 0.0042
lidar_bias_m: 0.06             # per-episode bias drawn from U(-b, b)
lidar_stochastic_m: 0.02       # per-beam, per-step std
